[package]
name = "operit-node-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["full"]
peer-state = ["dep:ring", "dep:operit-store", "dep:operit-util", "dep:serde_json", "dep:base64"]
full = ["peer-state", "dep:ring", "dep:uuid", "dep:futures-util", "dep:base64", "dep:serde_json", "dep:operit-runtime", "dep:operit-store", "dep:operit-tools", "dep:operit-util", "tokio/rt-multi-thread", "tokio/time", "tokio/net"]
test-support = []

[dependencies]
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"], optional = true }
uuid = { workspace = true, optional = true }

operit-peer-link = { path = "../peer-link" }
async-trait.workspace = true
futures-util = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
operit-host-api = { path = "../../foundation/host-api" }
operit-link = { path = "../../foundation/link" }
operit-runtime = { path = "../../runtime/application", default-features = false, features = ["javascript"], optional = true }
operit-store = { path = "../../persistence/store", optional = true }
operit-tools = { path = "../../tool/services", default-features = false, optional = true }
operit-util = { path = "../../foundation/util", optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "sync", "rt"] }

[build-dependencies]
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
operit-model = { path = "../../foundation/model" }
operit-rslink-runtime = { path = "../../rslink/runtime" }
rusqlite.workspace = true

operit-host-native-common = { path = "../../../../hosts/common/operit-host-native-common", features = ["tcp"] }
