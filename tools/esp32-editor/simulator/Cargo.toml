[package]
name = "operit-esp32-simulator"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
operit-host-native-common = { path = "../../../hosts/common/operit-host-native-common", features = ["tcp"] }
operit-host-native-scheduler = { path = "../../../hosts/common/operit-host-native-scheduler", default-features = false }
operit-peer-link = { path = "../../../core/crates/node/peer-link", features = ["tcp"] }
operit-edge-contract = { path = "../../../core/crates/node/edge-contract" }
async-trait = "0.1"
log = "0.4"
base64 = "0.22"
operit-host-api = { path = "../../../core/crates/foundation/host-api" }
operit-link = { path = "../../../core/crates/foundation/link" }
operit-node-edge = { path = "../../../core/crates/node/edge" }
mdns-sd = "0.12"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time", "io-util", "io-std"] }
